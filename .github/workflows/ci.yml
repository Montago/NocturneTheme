name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Icons up to date
        run: python tools/generate_icons.py --check

      - name: Build
        run: dotnet build NocturneTheme.slnx -c Release

      - name: Pack
        run: dotnet pack src/Nocturne.Wpf/Nocturne.Wpf.csproj -c Release --no-build -o artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*
