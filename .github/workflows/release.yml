# Publishes a package when a version tag is pushed; the tag picks the package:
#   v1.2.3      Nocturne.Wpf   git tag -a v1.2.3 -m "Nocturne.Wpf 1.2.3"; git push origin v1.2.3
#   web-v1.2.3  Nocturne.Web   git tag -a web-v1.2.3 -m "Nocturne.Web 1.2.3"; git push origin web-v1.2.3
#   avalonia-v1.2.3  Nocturne.Avalonia   git tag -a avalonia-v1.2.3 -m "Nocturne.Avalonia 1.2.3"; git push origin avalonia-v1.2.3
#
# - A GitHub release with the .nupkg and .snupkg attached (assets are replaced if the release exists,
#   so the workflow can be re-run for the same tag). Nocturne.Web and Nocturne.Avalonia releases are not
#   marked as the latest.
# - nuget.org: with Trusted Publishing (no API key stored anywhere). Runs only when the repository
#   variable NUGET_PUBLISH is 'true' and the repository secret NUGET_USER holds the nuget.org profile
#   name. Needs a Trusted Publishing policy on nuget.org: owner Montago, repository NocturneTheme,
#   workflow file release.yml; the first release of a package needs a policy that allows new packages.
#   https://learn.microsoft.com/nuget/nuget-org/trusted-publishing

name: Release

on:
  push:
    tags: ['v*.*.*', 'web-v*.*.*', 'avalonia-v*.*.*']

permissions:
  contents: write
  id-token: write # OIDC token for nuget.org Trusted Publishing

jobs:
  publish:
    runs-on: windows-latest
    env:
      PUBLISH_NUGET: ${{ vars.NUGET_PUBLISH == 'true' && secrets.NUGET_USER != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Package and version from tag
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == web-v* ]]; then
            echo "value=${GITHUB_REF_NAME#web-v}" >> "$GITHUB_OUTPUT"
            echo "package=Nocturne.Web" >> "$GITHUB_OUTPUT"
            echo "latest=false" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF_NAME" == avalonia-v* ]]; then
            echo "value=${GITHUB_REF_NAME#avalonia-v}" >> "$GITHUB_OUTPUT"
            echo "package=Nocturne.Avalonia" >> "$GITHUB_OUTPUT"
            echo "latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "package=Nocturne.Wpf" >> "$GITHUB_OUTPUT"
            echo "latest=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack
        run: dotnet pack src/${{ steps.version.outputs.package }}/${{ steps.version.outputs.package }}.csproj -c Release -o artifacts -p:Version=${{ steps.version.outputs.value }}

      # Exchanges the GitHub OIDC token for a nuget.org API key that is valid for one hour
      - name: nuget.org login (Trusted Publishing)
        if: env.PUBLISH_NUGET == 'true'
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        if: env.PUBLISH_NUGET == 'true'
        shell: bash
        # bash expands the glob; dotnet nuget push does not on the Windows runner
        run: |
          for pkg in artifacts/*.nupkg; do
            dotnet nuget push "$pkg" --source https://api.nuget.org/v3/index.json --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --skip-duplicate
          done

      - name: GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" artifacts/* --title "${{ steps.version.outputs.package }} ${{ steps.version.outputs.value }}" --generate-notes --latest=${{ steps.version.outputs.latest }}
          fi
